name: CI (Self-Hosted)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout-ci:
    name: Scout CI
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Node.js
        shell: pwsh
        run: |
          $v = (node --version).TrimStart('v')
          $major = [int]($v -split '\.')[0]
          node --version
          if ($major -lt 20) {
            throw "Node 20+ required on self-hosted runner (found v$major)"
          }

      - name: Run Scout local CI
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci.ps1
