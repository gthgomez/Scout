name: CI (Self-Hosted)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout-ci:
    name: Scout CI
    runs-on: [self-hosted, windows]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify Node.js
        shell: pwsh
        run: |
          $expected = (Get-Content .nvmrc -Raw).Trim()
          $v = (node --version).TrimStart('v')
          node --version
          if ($v -ne $expected) {
            throw "Node $expected (pinned in .nvmrc) required on self-hosted runner (found v$v). Install the pinned Node.js version."
          }

      - name: Run Scout local CI
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci.ps1
